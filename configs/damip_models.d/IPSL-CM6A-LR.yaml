# DAMIP model quirks: IPSL-CM6A-LR (docs/plan_ph3.md §4.2, §1.4)
#
# Full-variable model (14/14 vars incl. o3, per the 2026-07-05 ESGF availability
# matrix) -- the M4 debugging baseline: any pipeline anomaly on this model can't
# be blamed on missing data.
institution_id: IPSL
default_variant: r1i1p1f1
default_grid: gr              # NOT gn -- IPSL publishes Amon on the 'gr' grid label
calendar: gregorian             # sanity cross-check only; actual decoding always
                                 # trusts each file's own `calendar` NetCDF attribute
warm_years_default: [2011, 2020]
vertical:
  # Explicit override, NOT auto -- confirmed against real downloaded data
  # (2026-07-05) that IPSL's cl/clw/cli files carry bare `ap`/`b`/`ap_bnds`/
  # `b_bnds` variables on a dim named `presnivs` (not `lev`), with NO
  # `formula_terms` attribute anywhere linking them (unlike MRI-ESM2-0,
  # which does have one). Auto-detection (data/cmip6_common.py:
  # detect_vertical) requires a formula_terms string and has no fallback for
  # this -- with scheme:auto it would silently fall through to the
  # already-on-plev branch and reinterpret presnivs (hybrid) levels as if
  # they were pressure levels, producing wrong (not crashing) cloud fields.
  # ap/b convention confirmed correct (CMOR mainstream, p = ap + b*ps).
  scheme: hybrid_ap_b
  ap: ap
  b: b
