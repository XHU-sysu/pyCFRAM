# DAMIP M5 end-to-end case: HadGEM3-GC31-LL hist-aer, real ESGF data.
# Missing o3 only -- f3 variant + 360_day calendar (plan's deliberate
# calendar+variant stress test).
case_name: DAMIP_HadGEM3_histaer
description: "HadGEM3-GC31-LL hist-aer, first decade (1850-1859) vs last decade (2011-2020) climatology"

source:
  type: cmip6_damip
  model: HadGEM3-GC31-LL
  experiment: hist-aer
  variant: r1i1p1f3
  grid_label: gn
  raw_dir: raw_data/cmip6_damip/HadGEM3-GC31-LL/hist-aer
  base_years: [1850, 1859]
  warm_years: [2011, 2020]
  co2:
    source: constant
    base_ppmv: 284.7
    perturbed_ppmv: 284.7
  o3: auto
  aerosol:
    source: zero

grid:
  pressure_levels: [1, 5, 10, 20, 30, 50, 70, 100, 150, 200, 250, 300,
                    400, 500, 600, 700, 850, 925, 1000]

input:
  base_pres: input/base_pres.nc
  base_surf: input/base_surf.nc
  perturbed_pres: input/perturbed_pres.nc
  perturbed_surf: input/perturbed_surf.nc
  nonrad_forcing: input/nonrad_forcing.nc

radiation:
  scheme: rrtmg

run:
  nproc: auto

plot:
  key_region: {lon: [0, 360], lat: [-90, 90]}
