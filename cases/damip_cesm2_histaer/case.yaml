# DAMIP M4 end-to-end case: CESM2 hist-aer, real ESGF data
# (downloaded to hqlx210 via scripts/download_damip.py --model CESM2
# --experiment hist-aer). "Skip full house" demonstrator -- missing
# cl/clw/cli (cloud->SKIPPED), rsdt (solar->ANALYTIC), o3 (o3=auto ->
# CLIMATOLOGY injection). See configs/damip_models.d/CESM2.yaml.
# In the contract's suggested-model list; data ends 2014-12, so warm_years
# is shifted a decade earlier than IPSL/MRI.
case_name: DAMIP_CESM2_histaer
description: "CESM2 hist-aer, first decade (1850-1859) vs last available decade (2005-2014) climatology"

source:
  type: cmip6_damip
  model: CESM2
  experiment: hist-aer
  variant: r1i1p1f1
  grid_label: gn
  raw_dir: raw_data/cmip6_damip/CESM2/hist-aer
  base_years: [1850, 1859]
  warm_years: [2005, 2014]     # CESM2 hist-aer data ends 2014-12 (measured, plan §1.4)
  co2:
    source: constant
    base_ppmv: 284.7
    perturbed_ppmv: 284.7      # hist-aer: CO2 frozen at 1850 -> two states equal
  o3: auto                     # CESM2 has no o3 -> CESM 1850 climatology injection (frc_o3=0)
  aerosol:
    source: zero                # hist-aer: no 3D aerosol in Amon -> runner auto-skips

grid:
  pressure_levels: [1, 5, 10, 20, 30, 50, 70, 100, 150, 200, 250, 300,
                    400, 500, 600, 700, 850, 925, 1000]   # CMIP6 standard plev19, TOA->sfc

input:
  base_pres: input/base_pres.nc
  base_surf: input/base_surf.nc
  perturbed_pres: input/perturbed_pres.nc
  perturbed_surf: input/perturbed_surf.nc
  nonrad_forcing: input/nonrad_forcing.nc

radiation:
  scheme: rrtmg

run:
  nproc: auto

plot:
  key_region: {lon: [0, 360], lat: [-90, 90]}
