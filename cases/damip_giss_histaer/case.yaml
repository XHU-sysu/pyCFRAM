# DAMIP M5 end-to-end case: GISS-E2-1-G hist-aer, real ESGF data.
# Missing o3 only; hist-aer data ends 2014-12 like CESM2 -- warm_years
# shifted a decade earlier. 365_day calendar.
case_name: DAMIP_GISS_histaer
description: "GISS-E2-1-G hist-aer, first decade (1850-1859) vs last available decade (2005-2014) climatology"

source:
  type: cmip6_damip
  model: GISS-E2-1-G
  experiment: hist-aer
  variant: r1i1p1f1
  grid_label: gn
  raw_dir: raw_data/cmip6_damip/GISS-E2-1-G/hist-aer
  base_years: [1850, 1859]
  warm_years: [2005, 2014]
  co2:
    source: constant
    base_ppmv: 284.7
    perturbed_ppmv: 284.7
  o3: auto
  aerosol:
    source: zero

grid:
  pressure_levels: [1, 5, 10, 20, 30, 50, 70, 100, 150, 200, 250, 300,
                    400, 500, 600, 700, 850, 925, 1000]

input:
  base_pres: input/base_pres.nc
  base_surf: input/base_surf.nc
  perturbed_pres: input/perturbed_pres.nc
  perturbed_surf: input/perturbed_surf.nc
  nonrad_forcing: input/nonrad_forcing.nc

radiation:
  scheme: rrtmg

run:
  nproc: auto

plot:
  key_region: {lon: [0, 360], lat: [-90, 90]}
