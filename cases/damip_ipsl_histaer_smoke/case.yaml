# DAMIP smoke-test case: IPSL-CM6A-LR hist-aer, exercising the generalized
# run_case.py build dispatch + build_case_input.py registry/optional-huss
# support added in WP-M4.3 (docs/plan_ph3.md).
#
# This case intentionally points raw_dir at the tiny synthetic fixture
# checked into tests/data/damip_smoke/ipsl_mini/ (generated by
# tests/data/damip_smoke/_make_damip_fixtures.py, ~KB-scale NetCDFs), NOT at
# real ESGF data -- the real IPSL/MRI/CESM2 hist-aer downloads are a
# separate, in-progress WP (M4.5) on a remote node not available in this
# worktree. The fixture is a "full variable" hist-aer dataset (ta, hus, ts,
# ps, cl/clw/cli, rsdt, rsds, rsus, hfls, hfss, huss, o3), so this case
# exercises the all-ACTIVE decision-tree branch end-to-end, including huss
# being written to the surf NCs (DAMIP always provides huss; ERA5 never
# does -- see build_case_input.py's OPTIONAL_SURF_2D_VARS).
case_name: DAMIP_IPSL_histaer_smoke
description: "IPSL-CM6A-LR hist-aer smoke test (synthetic fixture, WP-M4.3 regression case)"

source:
  type: cmip6_damip
  model: IPSL-CM6A-LR
  experiment: hist-aer
  variant: r1i1p1f1
  grid_label: gr
  raw_dir: tests/data/damip_smoke/ipsl_mini
  base_years: [1850, 1851]
  warm_years: [1854, 1855]
  co2:
    source: constant
    base_ppmv: 284.7
    perturbed_ppmv: 284.7      # hist-aer: CO2 frozen at 1850 -> two states equal
  o3: auto                     # fixture provides o3 -> resolves to use_model (MODEL)
  aerosol:
    source: zero                # hist-aer: no 3D aerosol in Amon -> runner auto-skips

grid:
  pressure_levels: [100, 300, 500, 700, 1000]   # matches fixture's native plev (identity interp)

input:
  base_pres: input/base_pres.nc
  base_surf: input/base_surf.nc
  perturbed_pres: input/perturbed_pres.nc
  perturbed_surf: input/perturbed_surf.nc
  nonrad_forcing: input/nonrad_forcing.nc

radiation:
  scheme: rrtmg

plot:
  key_region: {lon: [0, 360], lat: [-90, 90]}
